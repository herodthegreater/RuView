name: Update vendor submodules

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Identity must be set BEFORE any operation that can create a commit.
      # `git submodule update --remote --merge` used to fail here with
      # "Committer identity unknown" because the merge inside vendor/ruvector
      # needs an author when the pinned commit isn't a fast-forward of upstream.
      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Use a plain `--remote` checkout (detached HEAD at each submodule's
      # configured `branch` tip from .gitmodules) rather than `--merge`. We only
      # want to bump the superproject's gitlink to the latest upstream commit;
      # there's no reason to create merge commits inside the vendored repos, and
      # `--merge` breaks whenever the current pin has diverged from that branch.
      - name: Update submodules to latest tracked branch
        run: |
          git submodule sync --recursive
          git submodule update --remote --recursive

      # Only vendor/ is committed below, so only vendor/ gitlink changes count;
      # otherwise a bump outside vendor/ makes `git commit` fail with
      # "nothing to commit".
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet --ignore-submodules=dirty -- vendor/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "--- submodule pointer changes ---"
            git submodule status --recursive || true
            git diff --submodule=log -- vendor/ || true
          fi

      # Reuse one bot-owned branch instead of a new timestamped branch per run:
      # an open PR is refreshed in place rather than a new branch + PR piling up
      # every 6 hours, and an unchanged pointer set is not re-pushed.
      - name: Create or update PR with updates
        if: steps.check.outputs.changed == 'true'
        run: |
          BRANCH="chore/update-submodules"
          git checkout -B "$BRANCH"
          git add vendor/
          git commit -m "chore: update vendor submodules to latest upstream"
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD -- vendor/; then
            echo "$BRANCH already carries these submodule pointers; not re-pushing."
          else
            git push --force origin "$BRANCH"
          fi
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Open PR #$EXISTING tracks $BRANCH."
            exit 0
          fi
          if ! gh pr create \
            --title "chore: update vendor submodules" \
            --body "Automated submodule update to the latest upstream commit on each submodule's tracked branch (see \`.gitmodules\`). Review the pointer diff before merging." \
            --base main \
            --head "$BRANCH"; then
            echo "::error::Could not open the PR (the pointers are pushed to $BRANCH). If the error above says 'GitHub Actions is not permitted to create or approve pull requests', enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
